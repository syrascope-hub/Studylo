name: Build Studylo APK (strong)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project
        run: |
          set -e
          if [ -f studylo.zip ]; then
            rm -rf proj && mkdir -p proj
            unzip -q -o studylo.zip -d proj
            P="$(find proj -name pubspec.yaml -not -path '*/.*' -not -path '*/build/*' | head -1)"
          elif [ -f pubspec.yaml ]; then
            P="./pubspec.yaml"
          else
            P="$(find . -name pubspec.yaml -not -path './.*' -not -path '*/build/*' | head -1)"
          fi
          if [ -z "$P" ]; then
            echo "::error::pubspec.yaml not found. Upload studylo.zip to the repo root."
            exit 1
          fi
          DIR="$(dirname "$P")"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project directory: $DIR"

      - name: Sanity check project files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          for f in pubspec.yaml lib/main.dart tool/setup.sh tool/patch_android.py assets/icon.png assets/icon_fg.png; do
            [ -e "$f" ] || { echo "::error::Missing file: $f"; exit 1; }
          done
          echo "All required files exist."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml', '**/studylo.zip') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Pillow (icon tooling)
        run: python3 -m pip install --quiet pillow || true

      - name: Prepare Android project, packages and icon
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash tool/setup.sh

      # يفرض الإعدادات الآمنة بغضّ النظر عن قالب Flutter
      - name: Harden Android config
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import pathlib, re
          app = pathlib.Path("android/app")
          for name in ("build.gradle", "build.gradle.kts"):
              f = app / name
              if not f.exists():
                  continue
              t = f.read_text(encoding="utf-8")
              kts = name.endswith(".kts")
              eq = " = " if kts else " "
              t = re.sub(r"minSdk(Version)?\s*=?\s*(flutter\.minSdkVersion|\d+)", "minSdk = 24", t)
              t = re.sub(r"compileSdk(Version)?\s*=?\s*(flutter\.compileSdkVersion|\d+)", "compileSdk = 35", t)
              t = re.sub(r"targetSdk(Version)?\s*=?\s*(flutter\.targetSdkVersion|\d+)", "targetSdk = 34", t)
              f.write_text(t, encoding="utf-8")
              print("hardened", f)
          gp = pathlib.Path("android/gradle.properties")
          lines = gp.read_text().splitlines() if gp.exists() else []
          keep = [l for l in lines if not re.match(r"(org\.gradle\.jvmargs|android\.useAndroidX|android\.enableJetifier|android\.suppressUnsupportedCompileSdk|org\.gradle\.caching|org\.gradle\.parallel)", l)]
          keep += [
              "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError",
              "android.useAndroidX=true",
              "android.enableJetifier=true",
              "android.suppressUnsupportedCompileSdk=35",
              "org.gradle.caching=true",
              "org.gradle.parallel=true",
          ]
          gp.write_text("\n".join(keep) + "\n")
          print(gp.read_text())
          PY

      - name: Show Android build config
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat android/gradle/wrapper/gradle-wrapper.properties
          grep -n "minSdk\|compileSdk\|targetSdk\|applicationId\|Desugaring\|desugar" android/app/build.gradle* || true
          grep -rn "kotlin\|com.android.application" android/settings.gradle* android/build.gradle* 2>/dev/null || true

      - name: Resolve packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze (informational)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 3 محاولات: release عادي، ثم بدون تصغير، ثم debug (حتى تحصل على APK دائماً)
      - name: Build APK (with fallbacks)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          : > build.log
          fb() {
            echo "=== flutter $* ===" | tee -a build.log
            flutter "$@" 2>&1 | tee -a build.log
            return "${PIPESTATUS[0]}"
          }
          if fb build apk --release; then
            echo "BUILD_MODE=release" >> "$GITHUB_ENV"
          elif fb build apk --release --no-shrink --no-tree-shake-icons --android-skip-build-dependency-validation; then
            echo "BUILD_MODE=release-noshrink" >> "$GITHUB_ENV"
          elif fb build apk --debug --android-skip-build-dependency-validation; then
            echo "BUILD_MODE=debug" >> "$GITHUB_ENV"
          else
            echo "::error::All build attempts failed. See build-log artifact / job summary."
            exit 1
          fi

      - name: Collect APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          mkdir -p out
          APK="$(find build/app/outputs/flutter-apk -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" "out/studylo-${BUILD_MODE}.apk"
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: studylo-apk
          path: ${{ env.PROJECT_DIR }}/out/*.apk
          if-no-files-found: error

      - name: Error summary
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          {
            echo "## Build mode: ${BUILD_MODE:-FAILED}"
            if [ -f build.log ]; then
              echo '### Errors (first 60 matches)'
              echo '```'
              grep -nE "FAILURE|What went wrong|error:|Error:|e: file|requires|Could not|Execution failed|minSdk|compileSdk" build.log | head -60 || true
              echo '```'
              echo '### Last 40 lines'
              echo '```'
              tail -40 build.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore
